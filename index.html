
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5ee">
  <title>Crong Archive</title>

  <style>
    :root {
      --bg: #f3f5ee;
      --surface: #fafbf7;
      --green: #657b62;
      --deep-green: #263d2d;
      --muted: #879184;
      --line: #dce3d7;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--deep-green);
      font-family:
        Inter, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Noto Sans KR", sans-serif;
    }

    body.viewer-open {
      overflow: hidden;
    }

    /* 헤더 */
    .header {
      max-width: 920px;
      margin: 0 auto;
      padding: 42px 24px 30px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 14px;
      color: var(--green);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2em;
    }

    .eyebrow::before {
      content: "";
      width: 7px;
      height: 7px;
      flex-shrink: 0;
      background: #8ca586;
      border-radius: 50%;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 6vw, 48px);
      font-weight: 650;
      letter-spacing: -0.055em;
    }

    .subtitle {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    .header-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 26px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.08em;
    }

    .count {
      color: var(--green);
      font-weight: 700;
    }

    /* 세로 이미지 목록 */
    .gallery {
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: min(872px, calc(100% - 32px));
      margin: 0 auto;
      padding-bottom: 52px;
    }

    .image-card {
      overflow: hidden;
      padding: 7px;
      background: var(--surface);
      border: 1px solid rgba(101, 123, 98, 0.12);
      border-radius: 15px;
      box-shadow: 0 4px 18px rgba(38, 61, 45, 0.035);
      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }

    .image-card img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 9px;
      cursor: zoom-in;
      transition: filter 0.25s ease;
    }

    .image-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(38, 61, 45, 0.09);
    }

    .image-card:hover img {
      filter: saturate(1.04);
    }

    /* 하단 */
    .footer {
      padding: 24px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      text-align: center;
      font-size: 10px;
      letter-spacing: 0.16em;
    }

    /* 전체 화면 뷰어: 원본 이미지 레이아웃과 분리 */
    .viewer {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      height: 100dvh;
      padding: 0;
      margin: 0;
      background: #18231b;

      visibility: hidden;
      opacity: 0;
      pointer-events: none;

      transition:
        opacity 0.16s ease,
        visibility 0.16s ease;
    }

    .viewer.active {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
    }

    .viewer img {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      object-fit: contain;
      cursor: zoom-out;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* 모바일 */
    @media (max-width: 600px) {
      .header {
        padding: 32px 20px 24px;
      }

      .gallery {
        width: calc(100% - 24px);
        gap: 12px;
      }

      .image-card {
        padding: 5px;
        border-radius: 11px;
      }

      .image-card img {
        border-radius: 7px;
      }
    }

    /* 모션 최소화 설정 */
    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .image-card,
      .image-card img,
      .viewer {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="eyebrow">PERSONAL COLLECTION</div>

    <h1>Crong Archive.</h1>

    <p class="subtitle">
      A little collection of everyday moments.<br>
      크롱의 작은 순간들을 모아둔 공간
    </p>

    <div class="header-bottom">
      <span>VISUAL DIARY</span>
      <span class="count">12 IMAGES</span>
    </div>
  </header>

  <main class="gallery" id="gallery">

    <div class="image-card">
      <img src="crong/Crong_vsc.png" alt="Crong VSC" loading="lazy">
    </div>

    <div class="image-card">
      <img src="crong/Crong_discordCall.png" alt="Crong Discord Call" loading="lazy">
    </div>

    <div class="image-card">
      <img src="crong/Crong_computer_Youtube.png" alt="Crong Computer YouTube" loading="lazy">
    </div>

    <div class="image-card">
      <img src="crong/Crong_photoshop.jpg" alt="Crong Photoshop" loading="lazy">
    </div>

    <div class="image-card">
      <img src="crong/Crong_tears.jpg" alt="Crong Tears" loading="lazy">
    </div>

    <div class="image-card">
      <img src="crong/Crong_meal2.png" alt="Crong Meal 2" loading="lazy">
    </div>

    <div class="image-card">
      <img src="crong/Crong_music.png" alt="Crong Music" loading="lazy">
    </div>

    <div class="image-card">
      <img src="crong/Crong_computer.png" alt="Crong Computer" loading="lazy">
    </div>

    <div class="image-card">
      <img src="crong/Crong_sleep.png" alt="Crong Sleep" loading="lazy">
    </div>

    <div class="image-card">
      <img src="crong/Crong_meal.png" alt="Crong Meal" loading="lazy">
    </div>

    <div class="image-card">
      <img src="crong/Crong_happytime.png" alt="Crong Happy Time" loading="lazy">
    </div>

    <div class="image-card">
      <img src="crong/Crong_racket.png" alt="Crong Racket" loading="lazy">
    </div>

  </main>

  <footer class="footer">
    MADE WITH CARE · CRONG ARCHIVE
  </footer>

  <!-- 전체 화면 이미지 레이어 -->
  <div
    class="viewer"
    id="viewer"
    aria-hidden="true"
    role="dialog"
    aria-label="이미지 전체 화면 보기"
  >
    <img id="viewerImage" src="" alt="">
  </div>

  <script>
    const images = document.querySelectorAll(".image-card img");
    const viewer = document.getElementById("viewer");
    const viewerImage = document.getElementById("viewerImage");

    let isViewerOpen = false;
    let previousFocusedElement = null;

    function openViewer(img) {
      if (isViewerOpen) return;

      isViewerOpen = true;
      previousFocusedElement = document.activeElement;

      // 기존 목록 이미지는 변경하지 않고 뷰어만 갱신
      viewerImage.src = img.currentSrc || img.src;
      viewerImage.alt = img.alt;

      document.body.classList.add("viewer-open");
      viewer.classList.add("active");
      viewer.setAttribute("aria-hidden", "false");
    }

    function closeViewer() {
      if (!isViewerOpen) return;

      isViewerOpen = false;

      viewer.classList.remove("active");
      viewer.setAttribute("aria-hidden", "true");
      document.body.classList.remove("viewer-open");

      // 닫는 애니메이션 중 이미지가 갑자기 사라지지 않도록
      // 다음에 열 때 새 이미지로 교체
      if (previousFocusedElement &&
          typeof previousFocusedElement.focus === "function") {
        previousFocusedElement.focus({ preventScroll: true });
      }
    }

    images.forEach((img) => {
      img.addEventListener("click", () => {
        openViewer(img);
      });
    });

    // 확대 화면을 클릭하면 닫기
    viewer.addEventListener("click", (event) => {
      if (event.target === viewer || event.target === viewerImage) {
        closeViewer();
      }
    });

    // ESC 키로 닫기
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && isViewerOpen) {
        closeViewer();
      }
    });

    // 브라우저 뒤로 가기나 페이지 이탈 시에도 스크롤 잠금 방지
    window.addEventListener("pageshow", () => {
      if (!isViewerOpen) {
        document.body.classList.remove("viewer-open");
      }
    });
  </script>

</body>
</html>
